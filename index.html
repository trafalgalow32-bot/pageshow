<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: var(--font-sans, 'Apple SD Gothic Neo', sans-serif); overflow: hidden; }

  .card {
    width: 100%;
    min-height: 520px;
    background: linear-gradient(160deg, #fff5f7 0%, #ffe8ef 40%, #fff0f5 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 32px 20px 28px;
    position: relative;
    overflow: hidden;
  }

  .bg-petals {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .title-text {
    font-size: 15px;
    font-weight: 500;
    color: #c0445a;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.2s forwards;
  }

  .subtitle-text {
    font-size: 13px;
    color: #d4758a;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.4s forwards;
  }

  .flower-stage {
    width: 220px;
    height: 240px;
    position: relative;
    margin-bottom: 20px;
  }

  .flower-svg { width: 100%; height: 100%; overflow: visible; }

  .message-box {
    background: rgba(255,255,255,0.72);
    border: 0.5px solid rgba(220,100,130,0.3);
    border-radius: 16px;
    padding: 18px 26px;
    max-width: 340px;
    text-align: center;
    backdrop-filter: blur(4px);
    opacity: 0;
    animation: fadeUp 0.9s ease 1.8s forwards;
  }

  .message-main {
    font-size: 17px;
    font-weight: 500;
    color: #a83050;
    line-height: 1.8;
    margin-bottom: 10px;
  }

  .message-sub {
    font-size: 13px;
    color: #c06070;
    line-height: 1.7;
  }

  /* 도착 뱃지 */
  .arrive-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    color: #fff;
    background: #e04060;
    border-radius: 20px;
    padding: 2px 9px;
    vertical-align: middle;
    position: relative;
    top: -1px;
    animation: badgePop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    box-shadow: 0 2px 8px rgba(220,60,90,0.25);
  }
  .arrive-badge.delay1 { animation-delay: 2.0s; opacity: 0; animation-fill-mode: both; }
  .arrive-badge.delay2 { animation-delay: 2.3s; opacity: 0; animation-fill-mode: both; }

  @keyframes badgePop {
    0%   { transform: scale(0.4) translateY(6px); opacity: 0; }
    60%  { transform: scale(1.15) translateY(-2px); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* 상품권 박스 */
  .coupon-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 4px 0 2px;
  }

  .coupon-text {
    font-size: 20px;
    font-weight: 500;
    color: #b02848;
    letter-spacing: -0.01em;
  }

  .hearts-row {
    margin-top: 14px;
    display: flex;
    justify-content: center;
    gap: 6px;
  }

  .heart {
    font-size: 16px;
    animation: heartbeat 1.4s ease-in-out infinite;
  }
  .heart:nth-child(2) { animation-delay: 0.2s; }
  .heart:nth-child(3) { animation-delay: 0.4s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }

  @keyframes bloomPetal {
    0% { transform-origin: bottom center; transform: scale(0) rotate(var(--r)); opacity: 0; }
    60% { opacity: 1; }
    100% { transform-origin: bottom center; transform: scale(1) rotate(var(--r)); opacity: 1; }
  }

  @keyframes riseUp {
    0% { transform: scaleY(0); transform-origin: bottom; opacity: 0; }
    100% { transform: scaleY(1); transform-origin: bottom; opacity: 1; }
  }

  @keyframes leafGrow {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-1.5deg); }
    50% { transform: rotate(1.5deg); }
  }

  .flower-group { transform-origin: bottom center; animation: sway 3.5s ease-in-out infinite; }
  .stem { animation: riseUp 0.6s ease 0.3s both; }
  .leaf-l { transform-origin: 106px 160px; animation: leafGrow 0.5s ease 0.8s both; }
  .leaf-r { transform-origin: 114px 148px; animation: leafGrow 0.5s ease 1.0s both; }

  .petal { transform-origin: 110px 100px; }
  .p1 { --r: 0deg;   animation: bloomPetal 0.5s ease 1.1s both; }
  .p2 { --r: 45deg;  animation: bloomPetal 0.5s ease 1.2s both; }
  .p3 { --r: 90deg;  animation: bloomPetal 0.5s ease 1.3s both; }
  .p4 { --r: 135deg; animation: bloomPetal 0.5s ease 1.4s both; }
  .p5 { --r: 180deg; animation: bloomPetal 0.5s ease 1.5s both; }
  .p6 { --r: 225deg; animation: bloomPetal 0.5s ease 1.6s both; }
  .p7 { --r: 270deg; animation: bloomPetal 0.5s ease 1.7s both; }
  .p8 { --r: 315deg; animation: bloomPetal 0.5s ease 1.8s both; }

  .center-bloom { animation: bloomPetal 0.4s ease 1.9s both; --r: 0deg; transform-origin: 110px 92px; }

  .sparkle { animation: sparkleAnim 2s ease-in-out infinite; }
  .sparkle:nth-child(2) { animation-delay: 0.5s; }
  .sparkle:nth-child(3) { animation-delay: 1s; }

  @keyframes sparkleAnim {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<div class="card">
  <svg class="bg-petals" viewBox="0 0 680 520" preserveAspectRatio="xMidYMid slice">
    <g opacity="0.12">
      <ellipse cx="60" cy="80" rx="18" ry="10" fill="#e05070" transform="rotate(-30 60 80)" />
      <ellipse cx="620" cy="60" rx="14" ry="8" fill="#e05070" transform="rotate(20 620 60)" />
      <ellipse cx="600" cy="400" rx="16" ry="9" fill="#c03060" transform="rotate(-15 600 400)" />
      <ellipse cx="80" cy="460" rx="20" ry="11" fill="#e05070" transform="rotate(40 80 460)" />
      <ellipse cx="340" cy="30" rx="12" ry="7" fill="#d04068" transform="rotate(10 340 30)" />
      <ellipse cx="160" cy="490" rx="10" ry="6" fill="#c04060" transform="rotate(-25 160 490)" />
      <ellipse cx="520" cy="490" rx="13" ry="7" fill="#e06080" transform="rotate(35 520 490)" />
    </g>
  </svg>

  <div class="content">
    <div class="title-text">어버이날</div>
    <div class="subtitle-text">Parents Day · 5월 8일</div>

    <div class="flower-stage">
      <svg class="flower-svg" viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg">
        <g class="flower-group">
          <g class="stem">
            <line x1="110" y1="210" x2="110" y2="110" stroke="#5a9e60" stroke-width="4" stroke-linecap="round"/>
          </g>
          <g class="leaf-l">
            <path d="M110 160 Q88 145 84 125 Q100 130 110 150Z" fill="#6ab870" opacity="0.9"/>
          </g>
          <g class="leaf-r">
            <path d="M110 148 Q132 133 136 113 Q120 120 110 142Z" fill="#5db068" opacity="0.9"/>
          </g>
          <g class="petal p1"><ellipse cx="110" cy="78" rx="9" ry="22" fill="#e05272" opacity="0.9"/></g>
          <g class="petal p2"><ellipse cx="110" cy="78" rx="9" ry="22" fill="#d94a6a" opacity="0.9" transform="rotate(45 110 100)"/></g>
          <g class="petal p3"><ellipse cx="110" cy="78" rx="9" ry="22" fill="#e05272" opacity="0.9" transform="rotate(90 110 100)"/></g>
          <g class="petal p4"><ellipse cx="110" cy="78" rx="9" ry="22" fill="#d94a6a" opacity="0.9" transform="rotate(135 110 100)"/></g>
          <g class="petal p5"><ellipse cx="110" cy="78" rx="9" ry="22" fill="#e05272" opacity="0.9" transform="rotate(180 110 100)"/></g>
          <g class="petal p6"><ellipse cx="110" cy="78" rx="9" ry="22" fill="#d94a6a" opacity="0.9" transform="rotate(225 110 100)"/></g>
          <g class="petal p7"><ellipse cx="110" cy="78" rx="9" ry="22" fill="#e05272" opacity="0.9" transform="rotate(270 110 100)"/></g>
          <g class="petal p8"><ellipse cx="110" cy="78" rx="9" ry="22" fill="#d94a6a" opacity="0.9" transform="rotate(315 110 100)"/></g>
          <g class="petal p1"><ellipse cx="110" cy="82" rx="7" ry="18" fill="#ee6888" opacity="0.85" transform="rotate(22.5 110 100)"/></g>
          <g class="petal p2"><ellipse cx="110" cy="82" rx="7" ry="18" fill="#e85a7e" opacity="0.85" transform="rotate(67.5 110 100)"/></g>
          <g class="petal p3"><ellipse cx="110" cy="82" rx="7" ry="18" fill="#ee6888" opacity="0.85" transform="rotate(112.5 110 100)"/></g>
          <g class="petal p4"><ellipse cx="110" cy="82" rx="7" ry="18" fill="#e85a7e" opacity="0.85" transform="rotate(157.5 110 100)"/></g>
          <g class="petal p5"><ellipse cx="110" cy="82" rx="7" ry="18" fill="#ee6888" opacity="0.85" transform="rotate(202.5 110 100)"/></g>
          <g class="petal p6"><ellipse cx="110" cy="82" rx="7" ry="18" fill="#e85a7e" opacity="0.85" transform="rotate(247.5 110 100)"/></g>
          <g class="petal p7"><ellipse cx="110" cy="82" rx="7" ry="18" fill="#ee6888" opacity="0.85" transform="rotate(292.5 110 100)"/></g>
          <g class="petal p8"><ellipse cx="110" cy="82" rx="7" ry="18" fill="#e85a7e" opacity="0.85" transform="rotate(337.5 110 100)"/></g>
          <g class="center-bloom">
            <circle cx="110" cy="100" r="14" fill="#f7a8bc"/>
            <circle cx="110" cy="100" r="9" fill="#f48aa8"/>
            <circle cx="110" cy="100" r="5" fill="#e86085"/>
          </g>
          <g>
            <g class="sparkle" style="transform-origin:130px 72px">
              <line x1="130" y1="68" x2="130" y2="76" stroke="#f4b0c4" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="126" y1="72" x2="134" y2="72" stroke="#f4b0c4" stroke-width="1.5" stroke-linecap="round"/>
            </g>
            <g class="sparkle" style="transform-origin:90px 76px">
              <line x1="90" y1="72" x2="90" y2="80" stroke="#f4b0c4" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="86" y1="76" x2="94" y2="76" stroke="#f4b0c4" stroke-width="1.5" stroke-linecap="round"/>
            </g>
            <g class="sparkle" style="transform-origin:118px 58px">
              <line x1="118" y1="55" x2="118" y2="61" stroke="#ee8fac" stroke-width="1.2" stroke-linecap="round"/>
              <line x1="115" y1="58" x2="121" y2="58" stroke="#ee8fac" stroke-width="1.2" stroke-linecap="round"/>
            </g>
          </g>
        </g>
        <ellipse cx="110" cy="215" rx="22" ry="5" fill="rgba(180,100,130,0.12)"/>
      </svg>
    </div>

    <div class="message-box">
      <div class="message-main">
        <span class="arrive-badge delay1">도착</span>
        &nbsp;효도 상품권 10만원&nbsp;
        <span class="arrive-badge delay2">도착</span>
      </div>
      <div class="message-sub">
        직접 찾아뵙지 못해 죄송해요 🙏<br>
        오늘 하루도 건강하시고 행복하세요
      </div>
      <div class="hearts-row">
        <span class="heart" style="color:#e05272;">♥</span>
        <span class="heart" style="color:#ee8fac;">♥</span>
        <span class="heart" style="color:#e05272;">♥</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
